# packages/shell/e2e/subflows/wait-for-home.yaml
appId: ${APP_ID}
---
- runFlow:
    when:
      visible: 'Play'
    commands:
      - tapOn: 'Continue'
- extendedWaitUntil:
    visible: 'Level 1'
    timeout: 5000
# Tap the alert first (a plain comment is no system-ui reason).
- tapOn:
    text: 'Allow'
