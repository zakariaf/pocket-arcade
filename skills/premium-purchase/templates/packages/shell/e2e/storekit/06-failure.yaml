# packages/shell/e2e/storekit/06-failure.yaml — Tier 2 Premium test. Run only by storekit-harness.ts,
# right after testArmFail; outside e2e/flows/, so the normal E2E run never picks it up.
appId: ${APP_ID}
name: A failed purchase shows the error state
tags: [storekit]
---
- launchApp
- runFlow:
    file: ../subflows/debug-setup.yaml
    env:
      QUERY: 'premium=0&screen=premium'
      WAIT_FOR: 'premium.screen'
- tapOn:
    id: 'premium.buy-button'
- extendedWaitUntil:
    visible:
      id: 'premium.state.error'
    timeout: 15000
