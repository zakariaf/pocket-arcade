# packages/shell/e2e/storekit/04-approval-relaunch.yaml — Tier 2 Premium test. Run only by storekit-harness.ts,
# right after testApproveAll; outside e2e/flows/, so the normal E2E run never picks it up.
appId: ${APP_ID}
name: An approved Ask to Buy turns Premium on without a tap
tags: [storekit]
---
- launchApp
- runFlow:
    file: ../subflows/debug-setup.yaml
    env:
      QUERY: 'screen=premium'
      WAIT_FOR: 'premium.screen'
- extendedWaitUntil:
    visible:
      id: 'premium.state.owned'
    timeout: 15000
