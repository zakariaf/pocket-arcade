# apps/demo/e2e/flows/journeys/14-endless.yaml — an endless run, lost by a player without
# Premium in an ads-off build, shows the endless result at once and sets the endless best (for a game
# with modes.endless; check-flows rule mode-flows asks for it). Lead decision L11, never strand a
# finished run: with ads off and no Premium no continue can be offered (the offer is 'hidden'), so the
# run end is recorded and the result shows at once, with no continue offer on it. The Premium continue
# has its own flow (12-continue-premium.yaml); the rewarded continue is admob-ads' ads-on smoke test.
# 1. the debug link fixes the endless seed (seed=42), keeps the player without Premium (premium=0),
#    switches ads off (ads=off) and opens Home;
# 2. Home's endless card (the key under test) starts the run;
# 3. action=lose-level loses it with the game's example loss (testing.examples.lose(), a score above 0);
# 4. at once the endless result: its title and New best!, and no continue offer;
# 5. Home: the endless card's label now carries a best above 0 (its label, "Endless – Best <n>",
#    is read through the card: the label and description are parts inside it).
appId: ${APP_ID}
name: Demo endless run lost without Premium shows the endless result at once and Home's best
tags: [demo, endless]
---
- launchApp:
    clearState: true
- runFlow:
    file: ../../../../../packages/shell/e2e/subflows/debug-setup.yaml
    env:
      QUERY: 'lang=en&theme=light&seed=42&premium=0&ads=off&firstRun=0&reduceMotion=1&screen=home'
      WAIT_FOR: 'home.endless-card'
- tapOn:
    id: 'home.endless-card'
- extendedWaitUntil:
    visible:
      id: 'game.screen'
    timeout: 15000
- runFlow:
    file: ../../../../../packages/shell/e2e/subflows/debug-setup.yaml
    env:
      QUERY: 'action=lose-level'
      WAIT_FOR: 'result.endless-title'
- assertVisible:
    id: 'result.endless-title'
- assertVisible:
    id: 'result.score-card.new-best'
# Nothing can rescue this run: no offer, no continue key of either kind.
- assertNotVisible:
    id: 'result.continue-offer'
- assertNotVisible:
    id: 'result.continue-ad-button'
- assertNotVisible:
    id: 'result.continue-premium-button'
- takeScreenshot: demo-endless-new-best
- tapOn:
    id: 'result.home-button'
- extendedWaitUntil:
    visible:
      id: 'home.screen'
    timeout: 15000
# A best above 0: any digit 1-9 in the card's label ("Best 0" before the run has none).
- assertVisible:
    id: 'home.endless-card'
    text: '.*[1-9].*'
