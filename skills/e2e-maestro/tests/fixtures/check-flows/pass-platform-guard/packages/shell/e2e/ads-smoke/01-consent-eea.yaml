# packages/shell/e2e/ads-smoke/01-consent-eea.yaml — the ads smoke flow on both platforms: Google's
# form on both, Apple's tracking prompt only on iOS (Android has none, lead decision L14).
appId: ${APP_ID}
name: In the EEA, S3 shows, then Google's form, then on iOS Apple's prompt, then the banner
tags: [ads-smoke]
---
- runFlow:
    file: ../subflows/debug-setup.yaml
    env:
      QUERY: 'geo=eea&lang=en&firstRun=0&screen=home'
      WAIT_FOR: 'consent.screen'
- tapOn:
    id: 'consent.continue-button'
# system-ui: Google's UMP form, on both platforms.
- tapOn:
    text: 'Consent'
- runFlow:
    when:
      platform: iOS
    commands:
      # system-ui: Apple's tracking prompt.
      - extendedWaitUntil:
          visible: 'Ask App Not to Track'
          timeout: 30000
      # system-ui: Apple's tracking prompt button.
      - tapOn: 'Ask App Not to Track'
- extendedWaitUntil:
    visible:
      id: 'home.screen'
    timeout: 15000
