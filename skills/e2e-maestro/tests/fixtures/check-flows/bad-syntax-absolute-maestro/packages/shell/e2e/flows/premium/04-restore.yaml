# quarantine 2026-09-25: the tablet keyboard covers the name field; fix by 2026-10-02
appId: ${APP_ID}
name: Premium restore shows the result dialog
tags: [shell, quarantine]
---
- launchApp:
    clearState: true
- runFlow:
    file: ../../subflows/debug-setup.yaml
    env:
      QUERY: 'lang=en&premium=0&firstRun=0&screen=premium'
      WAIT_FOR: 'premium.screen'
- tapOn:
    id: 'premium.restore-button'
