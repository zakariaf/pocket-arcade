# packages/shell/e2e/storekit/02-refund-relaunch.yaml — Tier 2 Premium test. Run only by storekit-harness.ts,
# right after testRefundAll; outside e2e/flows/, so the normal E2E run never picks it up.
appId: ${APP_ID}
name: A refunded Premium is revoked by the launch re-check
tags: [storekit]
---
- launchApp
- runFlow:
    file: ../subflows/debug-setup.yaml
    env:
      QUERY: 'screen=premium'
      WAIT_FOR: 'premium.screen'
# The launch re-check (Transaction.all) is answered only after storekitd has synced its transaction
# cache: 28 s after the arm step once (2026-10-01, iOS 26.5), so this wait allows 60 s.
- extendedWaitUntil:
    visible:
      id: 'premium.buy-button'
    timeout: 60000
