# packages/shell/e2e/storekit/07-store-unavailable.yaml — Tier 2 Premium test. Run only by storekit-harness.ts,
# with no arming step (the test store is not needed); outside e2e/flows/, so the normal E2E run never runs it.
appId: ${APP_ID}
name: Offline, the store is unavailable and BUY is disabled
tags: [storekit]
---
- launchApp
- runFlow:
    file: ../subflows/debug-setup.yaml
    env:
      QUERY: 'premium=0&offline=1&screen=premium'
      WAIT_FOR: 'premium.screen'
- extendedWaitUntil:
    visible:
      id: 'premium.state.unavailable'
    timeout: 15000
